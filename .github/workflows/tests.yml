name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Generates migrations only if none are committed yet.
      - run: python manage.py makemigrations catalog recommender
      - run: python manage.py check
      - run: python manage.py test -v 2
